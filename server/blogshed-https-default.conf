# Install as /etc/nginx/sites-available/blogshed-https-default and enable it.
# Keep the existing HTTP default; this supplies the missing HTTPS default.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/ssl/blogshed/origin.pem;
    ssl_certificate_key /etc/ssl/blogshed/origin.key;

    add_header Cache-Control "no-store" always;
    return 404;
}
