# Install on each WordPress hosting server as
# /etc/nginx/conf.d/blogshed-fallback.conf, then test and reload Nginx.
# Exact customer server names take precedence over the wildcard fallback.
server {
    listen 80;
    listen [::]:80;
    server_name *.blogshed.uk;

    default_type text/plain;
    return 404 "Blog not found.\n";
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _ *.blogshed.uk;

    ssl_certificate /etc/ssl/blogshed/origin.pem;
    ssl_certificate_key /etc/ssl/blogshed/origin.key;

    default_type text/plain;
    return 404 "Blog not found.\n";
}
